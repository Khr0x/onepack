# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# No dependencies yet; the list is kept as policy.
unused-allowed-license = "allow"
# Common permissive licenses in the Rust ecosystem. Expand only after review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are not published (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Temporary: reviewed pin of sqlx 0.9.1 while it is not on crates.io
# (RUSTSEC-2026-0459). Remove once sqlx 0.9.1 is published.
allow-git = ["https://github.com/transact-rs/sqlx"]
