# onepackd behind Nginx with TLS (Phase 7, ADR-018).
#
# - TLS terminates here; onepackd listens on 127.0.0.1:8080 with
#   --public-url https://packages.example.com (the same URL clients use).
# - Everything is forwarded to onepackd, which authenticates and authorizes each request. The data
#   directory (blobs) is never served directly: that would bypass authorization.
# - onepackd does not trust X-Forwarded-*: URLs come from --public-url. Since all
#   requests arrive with the proxy's IP, the per-IP limit is applied here (limit_req) and
#   disabled in onepackd (ONEPACK_IP_RATE_LIMIT=0).

limit_req_zone $binary_remote_addr zone=onepack_per_ip:10m rate=100r/s;

upstream onepackd {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name packages.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name packages.example.com;

    ssl_certificate     /etc/ssl/onepack/fullchain.pem;
    ssl_certificate_key /etc/ssl/onepack/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Equal to or greater than --max-package-size-mib (with extra margin for multipart).
    client_max_body_size 110m;

    # Uploads go straight to onepackd, which writes them to staging as they arrive.
    proxy_request_buffering off;
    # Downloads are streamed without copying them to disk on the proxy.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Load balancer probes do not consume the per-IP limit.
    location = /readyz {
        proxy_pass http://onepackd;
    }

    location / {
        limit_req zone=onepack_per_ip burst=2000 nodelay;
        limit_req_status 429;
        proxy_pass http://onepackd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
