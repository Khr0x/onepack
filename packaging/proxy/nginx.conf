# onepackd detrás de Nginx con TLS (Fase 7, ADR-018).
#
# - TLS termina aquí; onepackd escucha en 127.0.0.1:8080 con
#   --public-url https://packages.example.com (la misma URL que usan los clientes).
# - Todo se reenvía a onepackd, que autentica y autoriza cada petición. Nunca se sirve el
#   directorio de datos (blobs) directamente: eso saltaría la autorización.
# - onepackd no confía en X-Forwarded-*: las URLs salen de --public-url. Como todas las
#   peticiones llegan con la IP del proxy, el límite por IP se aplica aquí (limit_req) y en
#   onepackd se desactiva (ONEPACK_IP_RATE_LIMIT=0).

limit_req_zone $binary_remote_addr zone=onepack_per_ip:10m rate=100r/s;

upstream onepackd {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name packages.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name packages.example.com;

    ssl_certificate     /etc/ssl/onepack/fullchain.pem;
    ssl_certificate_key /etc/ssl/onepack/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Igual o mayor que --max-package-size-mib (más margen para el multipart).
    client_max_body_size 110m;

    # Las subidas van directas a onepackd, que las escribe en staging mientras llegan.
    proxy_request_buffering off;
    # Las descargas se transmiten sin copiarlas a disco en el proxy.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Las sondas de los balanceadores no consumen el límite por IP.
    location = /readyz {
        proxy_pass http://onepackd;
    }

    location / {
        limit_req zone=onepack_per_ip burst=2000 nodelay;
        limit_req_status 429;
        proxy_pass http://onepackd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
