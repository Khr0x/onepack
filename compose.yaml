name: onepack

services:
  onepackd:
    image: ghcr.io/khr0x/onepack:${ONEPACK_VERSION:-v0.1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ONEPACK_PUBLIC_URL: ${ONEPACK_PUBLIC_URL:-http://127.0.0.1:8080}
    volumes:
      - onepack-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/onepackd", "check", "--data-dir", "/data", "--quick"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  onepack-data:
