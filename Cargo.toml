[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/Khr0x/onepack"
license = "Apache-2.0"
description = "Self-hosted private package registry for NuGet, npm, and PyPI"
keywords = ["nuget", "package-registry", "self-hosted", "npm", "pypi"]
categories = ["development-tools", "web-programming"]
readme = "README.md"
publish = false

[workspace.dependencies]
onepack-core = { path = "crates/core" }
onepack-nuget = { path = "crates/nuget" }
onepack-storage = { path = "crates/storage" }
onepack-api-client = { path = "crates/api-client" }
onepack-server = { path = "crates/server" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Temporary: sqlx 0.9.1 is not on crates.io yet and 0.9.0 caps
# libsqlite3-sys below 0.38.0 (RUSTSEC-2026-0459). Remove after 0.9.1 ships.
[patch.crates-io]
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "4f22dcfd42cbc15ea7a977cb38a39ef0ce6b3be4" }
