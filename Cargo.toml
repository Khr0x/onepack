[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/Khr0x/onepack"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
onepack-core = { path = "crates/core" }
onepack-nuget = { path = "crates/nuget" }
onepack-storage = { path = "crates/storage" }
onepack-api-client = { path = "crates/api-client" }
onepack-server = { path = "crates/server" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
