name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, fronteras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup instala la versión fijada en rust-toolchain.toml al invocar cargo.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/check-crate-deps.sh

  deny:
    name: cargo-deny (licencias, advisories, fuentes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  dotnet-conformance:
    name: .NET (fixtures de conformidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Empaquetar fixtures
        run: |
          for proj in tests/conformance-dotnet/fixtures/*/*.csproj; do
            dotnet pack "$proj" -c Release -o target/nupkgs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-nupkgs
          path: target/nupkgs/*.nupkg
