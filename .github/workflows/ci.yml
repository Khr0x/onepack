name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests, crate boundaries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup installs the version pinned in rust-toolchain.toml when cargo runs.
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests (including fault injection)
        run: cargo test --workspace --all-features --locked
      - name: Disk-full recovery (tmpfs)
        run: ./tests/recovery/disk-full.sh
      - name: Crate boundaries (ADR-003)
        run: ./scripts/check-crate-deps.sh

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  dotnet-conformance:
    name: .NET (conformance with real clients)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tests/conformance-dotnet/global.json
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Version corpus up to date with NuGet.Versioning (ADR-008)
        run: ./scripts/version-corpus.sh --check
      - name: dotnet push / restore E2E (ADR-019)
        run: ./scripts/e2e-dotnet.sh
