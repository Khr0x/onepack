name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests, crate boundaries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup installs the version pinned in rust-toolchain.toml when cargo runs.
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests (including fault injection)
        run: cargo test --workspace --all-features --locked
      - name: Security suite (ADR-014)
        run: cargo test -p onepack-server --test security --locked -- --nocapture
      - name: Disk-full recovery (tmpfs)
        run: ./tests/recovery/disk-full.sh
      - name: Crate boundaries (ADR-003)
        run: ./scripts/check-crate-deps.sh

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  dotnet-conformance:
    name: .NET ${{ matrix.sdk }} on ${{ matrix.os }}${{ matrix.tls && ' (TLS proxy)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, sdk: "8.0", corpus: true }
          - { os: ubuntu-24.04, sdk: "10.0", tls: true }
          - { os: macos-15, sdk: "8.0" }
          - { os: macos-15, sdk: "10.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}.x
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Version corpus up to date with NuGet.Versioning (ADR-008)
        if: matrix.corpus
        run: ./scripts/version-corpus.sh --check
      - name: dotnet push / search / restore / unlist / block E2E (ADR-019)
        run: ./scripts/e2e-dotnet.sh
        env:
          ONEPACK_E2E_SDK: ${{ matrix.sdk }}.100
          ONEPACK_E2E_TLS: ${{ matrix.tls && '1' || '0' }}
      - name: onepack CLI end to end, no UI (ADR-015, ADR-016)
        run: ./scripts/e2e-cli.sh
        env:
          ONEPACK_E2E_SDK: ${{ matrix.sdk }}.100
      - name: MVP decisive test (install, publish, CI restore, revoke, block, recover)
        run: ./scripts/e2e-decisive.sh
        env:
          ONEPACK_E2E_SDK: ${{ matrix.sdk }}.100

  windows-conformance:
    # The script uses tests/conformance-dotnet/global.json (SDK 8); SDK 10 is covered on Linux and macOS.
    name: nuget.exe and .NET 8.0 on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: nuget.exe push / search / install and dotnet restore E2E (ADR-019)
        shell: pwsh
        run: ./tests/conformance-dotnet/e2e-windows.ps1

  recovery-backup:
    name: Recovery (1/2) backup on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@v2
      - name: Publish packages and take a backup with the server running (ADR-017)
        run: ./scripts/e2e-recovery.sh backup "$RUNNER_TEMP/onepack-backup.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: onepack-backup
          path: ${{ runner.temp }}/onepack-backup.tar.gz
          retention-days: 3

  recovery-restore:
    # Different machine and OS from the backup: the phase 7 gate.
    name: Recovery (2/2) restore on macOS and dotnet restore
    needs: recovery-backup
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: onepack-backup
          path: ${{ runner.temp }}
      - name: Restore, check and dotnet restore against the restored server
        run: ./scripts/e2e-recovery.sh restore "$RUNNER_TEMP/onepack-backup.tar.gz"

  operations:
    name: systemd, container and reverse proxy examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: systemd unit with hardening, restart after SIGKILL
        run: ./tests/ops/systemd.sh
      - name: Container image (non-root, volume, probes)
        run: ./tests/ops/container.sh
      - name: Nginx and Caddy examples are valid
        run: ./tests/ops/proxy-configs.sh

  benchmark:
    name: Benchmark (container, 2 vCPU / 1 GiB)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark
        run: python3 scripts/bench.py --docker --out bench-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
