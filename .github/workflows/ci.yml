name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, fronteras)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup instala la versión fijada en rust-toolchain.toml al invocar cargo.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Recuperación con disco lleno (tmpfs)
        run: ./tests/recovery/disk-full.sh
      - run: ./scripts/check-crate-deps.sh

  deny:
    name: cargo-deny (licencias, advisories, fuentes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  dotnet-conformance:
    name: .NET (conformidad con clientes reales)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tests/conformance-dotnet/global.json
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Corpus de versiones al día con NuGet.Versioning (ADR-008)
        run: ./scripts/version-corpus.sh --check
      - name: E2E push / restore con dotnet (ADR-019)
        run: ./scripts/e2e-dotnet.sh
