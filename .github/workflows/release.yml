name: Release

# Tag v* -> builds, checksums, keyless signature (Sigstore) and a draft GitHub release.
# workflow_dispatch -> same build and signature, kept as workflow artifacts (no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server and CLI: static Linux binaries (musl).
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, server: true, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, server: true, musl: true }
          # CLI only.
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != workspace version $crate"; exit 1; }
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          packages="-p onepack-cli"
          if [ "${{ matrix.server }}" = "true" ]; then packages="$packages -p onepack-server"; fi
          cargo build --release --locked --target ${{ matrix.target }} $packages
      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-dev.${GITHUB_SHA::7}; fi
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=.exe ;; esac
          mkdir -p dist
          for bin in onepack onepackd; do
            exe="target/${{ matrix.target }}/release/$bin$ext"
            [ -f "$exe" ] || continue
            name="$bin-$version-${{ matrix.target }}"
            mkdir "$name"
            cp "$exe" README.md LICENSE "$name/"
            if [ -n "$ext" ]; then
              7z a -tzip "dist/$name.zip" "$name" >/dev/null
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  verify:
    # The acceptance test against the release binaries themselves, not a debug build.
    name: Acceptance test with the release binaries (Linux x86-64)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - name: Unpack
        run: |
          mkdir -p bin
          for f in dist/*.tar.gz; do tar -xzf "$f" -C dist; done
          cp dist/*/onepack dist/*/onepackd bin/
          file bin/*
      - name: Install, publish, CI restore, revoke, block and recover
        run: ./scripts/e2e-acceptance.sh
        env:
          ONEPACK_BIN_DIR: bin

  verify-cli:
    # The release CLI on Linux: system keychain, headless machine, TLS trust and other distributions.
    name: Linux CLI checks with the release binaries (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - name: Unpack
        run: |
          mkdir -p bin
          for f in dist/*.tar.gz; do tar -xzf "$f" -C dist; done
          cp dist/*/onepack dist/*/onepackd bin/
          file bin/*
      - name: Keychain, headless, TLS and distributions
        run: ./scripts/e2e-cli-linux.sh
        env:
          ONEPACK_BIN_DIR: bin
          ONEPACK_E2E_DISTROS: debian:12 fedora:41 rockylinux:9 alpine:3.20

  publish:
    name: Checksums, signature and release
    needs: [build, verify, verify-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Keyless signature of the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify the signature
        working-directory: dist
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
      - name: Draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "onepack $GITHUB_REF_NAME" \
            --notes "Binaries, SHA256SUMS and its Sigstore bundle. Container image: $image:$GITHUB_REF_NAME. Verification: docs/runbooks/install.md."

  container:
    name: Container image (GHCR)
    needs: [build, verify, verify-cli, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Prepare image context
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p image/linux/amd64 image/linux/arm64 image/data
          for spec in "amd64:x86_64-unknown-linux-musl" "arm64:aarch64-unknown-linux-musl"; do
            arch="${spec%%:*}"
            target="${spec#*:}"
            tar -xzf "dist/onepackd-$version-$target.tar.gz" -C "image/linux/$arch" --strip-components=1
          done
          cp LICENSE image/LICENSE
          touch image/data/.keep
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: image
          file: packaging/container/Containerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
