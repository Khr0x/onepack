[package]
name = "onepack-server"
description = "Servidor onepack (onepackd)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
onepack-core.workspace = true
onepack-nuget.workspace = true
onepack-storage.workspace = true
onepack-api-client.workspace = true
axum = { version = "0.8.9", features = ["multipart"] }
hyper = { version = "1.11.1", features = ["http1"] }
getrandom = "0.4.3"
fs4 = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync", "io-util", "time"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tokio-util = { version = "0.7.19", features = ["io"] }
base64 = "0.23.1"

[features]
# Puntos de fallo para las pruebas de recuperación. Nunca en builds de release.
fault-injection = ["onepack-storage/fault-injection"]

[lints]
workspace = true

[[bin]]
name = "onepackd"
path = "src/main.rs"

[[test]]
# Suite de seguridad de la Fase 5 (ADR-014): artefactos maliciosos sintéticos y abuso.
name = "security"
path = "../../tests/security/main.rs"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
