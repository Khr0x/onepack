[package]
name = "onepack-api-client"
description = "Contratos y cliente de la API administrativa /api/v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", optional = true, features = ["platform-verifier"] }
base64 = { version = "0.23.1", optional = true }

[features]
# Cliente HTTP bloqueante para `onepack`. El servidor solo usa los contratos.
client = ["dep:ureq", "dep:base64"]

[lints]
workspace = true
