[package]
name = "onepack-cli"
description = "CLI administrativo de onepack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
onepack-api-client = { workspace = true, features = ["client"] }
onepack-nuget.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
keyring = "4.2.0"
quick-xml = "0.42.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[lints]
workspace = true

[[bin]]
name = "onepack"
path = "src/main.rs"

[dev-dependencies]
onepack-core.workspace = true
onepack-server.workspace = true
onepack-storage.workspace = true
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
