[package]
name = "onepack-cli"
description = "onepack administrative CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
onepack-api-client = { workspace = true, features = ["client"] }
onepack-nuget.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
keyring-core = "1.0.0"
quick-xml = "0.42.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[lints]
workspace = true

[[bin]]
name = "onepack"
path = "src/main.rs"

[dev-dependencies]
onepack-core.workspace = true
onepack-server.workspace = true
onepack-storage.workspace = true
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
