[package]
name = "onepack-storage"
description = "onepack persistence: SQLite metadata and blob store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fs4 = "1.1.0"
getrandom = "0.4.3"
onepack-core.workspace = true
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "macros", "time"] }
tracing = "0.1.44"

[features]
# Fault injection points for recovery tests. Never in release builds.
fault-injection = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
