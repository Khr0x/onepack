[package]
name = "onepack-storage"
description = "Persistencia de onepack: metadatos SQLite y almacén de blobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fs4 = "1.1.0"
onepack-core.workspace = true
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "rt", "macros", "time"] }
tracing = "0.1.44"

[features]
# Puntos de fallo para las pruebas de recuperación. Nunca en builds de release.
fault-injection = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
